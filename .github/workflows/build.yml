name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.37

      - name: Build APK
        env:
          P4A_freetype_URL: https://downloads.sourceforge.net/project/freetype/freetype2/2.14.1/freetype-2.14.1.tar.gz
        run: |
          buildozer android debug

      - name: Show generated files
        if: always()
        run: |
          echo "===== APK Search ====="
          find . -type f -name "*.apk"
          echo ""
          echo "===== AAB Search ====="
          find . -type f -name "*.aab"
          echo ""
          echo "===== BIN Folder ====="
          ls -R bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sales-analytics-apk
          path: |
            **/*.apk
            **/*.aab
